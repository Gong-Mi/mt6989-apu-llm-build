name: MT6989 APU build

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: 'Final direct NeuroPilot SDK archive URL (not the docs page)'
        required: true
        type: string
      sdk_sha256:
        description: 'Expected SDK archive SHA-256 (optional for audit)'
        required: false
        type: string
      model_url:
        description: 'Optional direct public model/precompiled MT6989 model URL'
        required: false
        type: string
      model_repo:
        description: 'Optional Hugging Face model repo, for example Qwen/Qwen3.5-2B'
        required: false
        type: string
      model_revision:
        description: 'Hugging Face revision (default main)'
        required: false
        default: main
        type: string
      model_sha256:
        description: 'Expected model SHA-256'
        required: false
        type: string
      mode:
        description: 'audit, build, or package'
        required: true
        default: audit
        type: choice
        options: [audit, build, package]

permissions:
  contents: read

jobs:
  fetch-and-build:
    # Public repositories receive the larger standard Linux runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MODE: ${{ inputs.mode }}
      SDK_URL: ${{ inputs.sdk_url }}
      SDK_SHA256: ${{ inputs.sdk_sha256 }}
      MODEL_URL: ${{ inputs.model_url }}
      MODEL_REPO: ${{ inputs.model_repo }}
      MODEL_REVISION: ${{ inputs.model_revision }}
      MODEL_SHA256: ${{ inputs.model_sha256 }}
      WORK: ${{ github.workspace }}/.mt6989-apu-work
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11 for the SDK wheel
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare ephemeral workspace
        shell: bash
        run: |
          set -euo pipefail
          echo '=== runner identity ==='
          uname -a
          uname -m
          nproc
          free -h
          echo '=== filesystems ==='
          df -hT
          echo '=== byte capacities ==='
          df -B1 /
          df -B1 "$RUNNER_TEMP" || true
          mkdir -p "$WORK/downloads" "$WORK/sdk" "$WORK/model" out
          printf 'runner=%s\n' "$RUNNER_NAME"
          printf 'mode=%s\n' "$MODE"
          test -n "$SDK_URL"

      - name: Download official SDK archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 3 \
            --proto '=https' --tlsv1.2 \
            "$SDK_URL" -o "$WORK/downloads/neuro-sdk.archive"
          test -s "$WORK/downloads/neuro-sdk.archive"
          sha256sum "$WORK/downloads/neuro-sdk.archive" | tee out/sdk.sha256
          if [[ -n "$SDK_SHA256" ]]; then
            echo "$SDK_SHA256  $WORK/downloads/neuro-sdk.archive" | sha256sum -c -
          fi

      - name: Verify and unpack SDK without executing bundled binaries
        shell: bash
        run: |
          set -euo pipefail
          gzip -t "$WORK/downloads/neuro-sdk.archive"
          tar -tzf "$WORK/downloads/neuro-sdk.archive" > out/sdk-members.txt
          tar -xzf "$WORK/downloads/neuro-sdk.archive" -C "$WORK/sdk"
          python3 - <<'PY'
          from pathlib import Path
          root = Path('out/sdk-members.txt')
          lines = root.read_text(errors='replace').splitlines()
          for needle in ('NeuronAdapter.h', 'mtk_neuron', 'mtk_converter', 'nir-compilation-service'):
              hits = [x for x in lines if needle.lower() in x.lower()]
              print(f'{needle}: {len(hits)}')
              for x in hits[:8]: print('  '+x)
          PY

      - name: Download optional model
        if: ${{ inputs.model_url != '' || inputs.model_repo != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MODEL_REPO" ]]; then
            git lfs install --local
            git clone --depth 1 --branch "$MODEL_REVISION" \
              "https://huggingface.co/$MODEL_REPO" "$WORK/model/repo"
            git -C "$WORK/model/repo" lfs pull
            python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["WORK"]) / "model" / "repo"
          files = [p for p in root.rglob("*") if p.is_file() and p.name.endswith((".safetensors", ".bin"))]
          if not files:
              raise SystemExit("no model weight files after git lfs pull")
          for p in files:
              b = p.read_bytes()[:128]
              if b.startswith(b"version https://git-lfs.github.com/spec/v1"):
                  raise SystemExit(f"LFS pointer remains: {p}")
              print(f"model_file={p} bytes={p.stat().st_size}")
          PY
          elif [[ -n "$MODEL_URL" ]]; then
            curl --fail --location --retry 4 --retry-delay 3 \
              --proto '=https' --tlsv1.2 \
              "$MODEL_URL" -o "$WORK/model/model.input"
            test -s "$WORK/model/model.input"
            sha256sum "$WORK/model/model.input" | tee out/model.sha256
            if [[ -n "$MODEL_SHA256" ]]; then
              echo "$MODEL_SHA256  $WORK/model/model.input" | sha256sum -c -
            fi
          fi

      - name: Record host toolchain boundary
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          python3 --version
          find "$WORK/sdk" -type f -name '*.whl' -o -name 'nir-compilation-service' \
            | sort | while read -r f; do file "$f"; done
          # Do not execute an SDK-bundled service during the audit job.

      - name: Install and smoke-test the official host converter
        if: ${{ inputs.mode == 'build' || inputs.mode == 'package' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$WORK/venv"
          WHEEL=$(find "$WORK/sdk" -type f -name 'mtk_converter-*cp311*.whl' | head -1)
          test -n "$WHEEL"
          "$WORK/venv/bin/python" -m pip install --disable-pip-version-check "$WHEEL"
          "$WORK/venv/bin/python" -c 'import mtk_converter; print("mtk_converter_import=ok")'
          "$WORK/venv/bin/mtk_dissect_tflite_model" --help > out/mtk_dissect_tflite_model.help.txt
          "$WORK/venv/bin/mtk_pytorch_converter" --help > out/mtk_pytorch_converter.help.txt 2>&1 || true
          "$WORK/venv/bin/mtk_pytorch_v2_converter" --help > out/mtk_pytorch_v2_converter.help.txt 2>&1 || true
          mkdir -p out/artifacts
          cp tests/models/float_bmm.tflite out/artifacts/
          sha256sum out/artifacts/float_bmm.tflite | tee out/artifacts.sha256

      - name: Attempt Qwen Hugging Face to ExportedProgram conversion
        if: ${{ inputs.mode == 'build' && inputs.model_repo != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'torch==2.3.1' \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check \
            'transformers==5.15.0' 'huggingface-hub>=1.5.0' \
            'tokenizers==0.23.0' 'safetensors>=0.8.0' 'accelerate' \
            'packaging' 'pyyaml' 'regex' 'requests' 'tqdm' 'numpy' \
            'httpx' 'httpcore' 'h11' 'anyio' 'certifi' 'idna' \
            --no-deps
          python - <<'PY'
          from pathlib import Path
          import site
          p = Path(site.getsitepackages()[0]) / "transformers" / "utils" / "import_utils.py"
          s = p.read_text()
          old = 'TORCH_MINIMUM_VERSION = "2.5.0"'
          if old not in s:
              raise SystemExit("transformers torch version guard not found")
          p.write_text(s.replace(old, 'TORCH_MINIMUM_VERSION = "2.3.0"'))
          print("patched_transformers_torch_guard", p)
          PY
          mkdir -p out/artifacts
          python scripts/export_hf_qwen.py \
            --model "$WORK/model/repo" \
            --output out/artifacts/qwen-exported-program.pt2
          "$WORK/venv/bin/mtk_pytorch_v2_converter" \
            --input_exported_program_file out/artifacts/qwen-exported-program.pt2 \
            --output_file out/artifacts/qwen3.5-2b.tflite \
            --input_shapes 1,16

      - name: Package large build outputs in 512 MiB chunks
        if: ${{ inputs.mode == 'package' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d out/artifacts
          tar -czf out/build-artifacts.tar.gz -C out/artifacts .
          python3 scripts/package_chunks.py out/build-artifacts.tar.gz out/chunks 512
          rm -f out/build-artifacts.tar.gz

      - name: Upload public build evidence
        uses: actions/upload-artifact@v4
        with:
          name: mt6989-apu-evidence-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup ephemeral proprietary inputs
        if: always()
        shell: bash
        run: rm -rf "$WORK"
